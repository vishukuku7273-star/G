<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CoinLab — AI Trend → Coin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08080a;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif}
main{max-width:620px;margin:auto;padding:18px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 2px 28px}.brand{font-weight:900;letter-spacing:-.04em}.live{font-size:10px;color:#8d8d96;letter-spacing:.12em}.hero{padding:18px 0 28px}.eyebrow{font-size:10px;color:#8d8d96;letter-spacing:.15em;font-weight:900}.hero h1{font-size:54px;line-height:.94;letter-spacing:-.065em;margin:12px 0 18px}.hero h1 i{font-style:normal;color:#a1a1aa}.hero p{color:#a1a1aa;line-height:1.5}.panel,.trendCard{background:#121216;border:1px solid #28282e;border-radius:21px;padding:18px;margin:13px 0}.panel label{display:block;color:#8d8d96;font-size:10px;font-weight:900;letter-spacing:.1em;margin:13px 0 8px}.panel label:first-child{margin-top:0}textarea,input{width:100%;background:#09090b;color:#fff;border:1px solid #303036;border-radius:14px;padding:14px;font:inherit;outline:none}textarea{min-height:105px;resize:vertical}button{width:100%;border:0;border-radius:14px;background:#f5f5f5;color:#08080a;padding:14px;font:inherit;font-weight:850;margin-top:10px}button:disabled{opacity:.4}.ghost{background:#28282e;color:#fff}.sectionTitle,.pageTitle{display:flex;justify-content:space-between;align-items:end;margin:27px 0 12px}.sectionTitle b,.pageTitle b{font-size:20px}.sectionTitle small,.pageTitle span{font-size:10px;color:#777780}.trend{display:flex;gap:12px;align-items:center;border-top:1px solid #25252a;padding:15px 3px}.rank{width:25px;color:#666}.trend p{color:#94949d;font-size:12px;margin:4px 0;line-height:1.4}.trend strong{margin-left:auto}.trendHead{display:flex;justify-content:space-between}.trendHead small{display:block;color:#777780;margin-top:4px;font-size:11px}.trendCard p{color:#9999a2;font-size:13px;line-height:1.45}.ideas{display:grid;grid-template-columns:1fr 1fr;gap:9px}.idea{background:#1b1b20;color:#fff;text-align:left;margin:0;border:1px solid #303038}.idea b,.idea em,.idea small{display:block}.idea em{font-style:normal;color:#a1a1aa;font-size:12px;margin-top:3px}.idea small{color:#777780;font-weight:500;line-height:1.3;margin-top:8px}.signal{background:#15151a;border:1px solid #37373e;padding:13px;border-radius:14px;color:#aaa;font-size:13px}.fine{font-size:11px;color:#6f6f78;line-height:1.45}.toast{position:fixed;left:14px;right:14px;bottom:78px;max-width:592px;margin:auto;background:#202026;border:1px solid #3a3a42;border-radius:14px;padding:13px;font-size:12px;z-index:20;overflow-wrap:anywhere}nav{position:fixed;left:50%;transform:translateX(-50%);bottom:10px;width:min(584px,calc(100% - 24px));height:62px;background:#15151aee;backdrop-filter:blur(18px);border:1px solid #2a2a30;border-radius:20px;display:flex;align-items:center;justify-content:space-around;z-index:10}nav button{width:70px;background:none;color:#aaa;margin:0;padding:7px}nav small{display:block;font-size:9px;margin-top:2px}.plus{width:48px;height:48px;border-radius:50%;font-size:24px;padding:0}
.success h2{margin-top:0}.success code{display:block;overflow-wrap:anywhere;color:#aaa;margin:10px 0}.success a{display:block;color:#fff;font-weight:800;margin-top:14px}
@media(min-width:700px){main{padding-top:28px}}
</style>
</head>
<body>
<main>
<header><div class="brand">◉ COINLAB</div><div class="live">RESEARCH MODE</div></header>
<div id="app"></div>
<nav>
<button onclick="show('home')">⌂<small>Home</small></button>
<button onclick="show('trends')">⌁<small>Trends</small></button>
<button class="plus" onclick="show('create')">＋</button>
<button onclick="show('coins')">◈<small>Coins</small></button>
</nav>
</main>
<script>
const fallback=[
{topic:"AI agents & autonomous apps",score:86,momentum:"Rising",why:"AI-agent narratives are active across crypto and tech communities.",ideas:[["Agent Bro","AGBRO","AI agent meme with a builder culture angle."],["Claw Mode","CLAW","Autonomous AI mascot concept."]]},
{topic:"Internet meme remix",score:82,momentum:"Fast",why:"Simple, remixable internet memes can spread quickly.",ideas:[["Meme Engine","MEME","Self-referential meme concept."],["Brainrot","ROT","Chaotic internet-culture concept."]]},
{topic:"Solana / crypto culture",score:78,momentum:"Active",why:"Solana-native culture remains a large discovery surface for community coins.",ideas:[["Solana Gremlin","GREML","Chaotic Solana-native mascot."],["Curve Rat","RAT","Character living on the bonding curve."]]}
];
let trends=fallback, chosen=null, wallet="";

function shell(html){document.getElementById("app").innerHTML=html}
function show(page){
 if(page==="home") home(); if(page==="trends") trendsPage(); if(page==="create") create(); if(page==="coins") coins();
}
function home(){
 shell(`<section class="hero"><div class="eyebrow">AI MEME COIN LAB</div><h1>Catch the trend.<br><i>Build the coin.</i></h1><p>Research current topics, generate ticker concepts, review them yourself, and then launch through your own Solana wallet.</p></section>
 <section class="panel"><label>WHAT ARE YOU THINKING?</label><textarea id="idea" placeholder="e.g. today's biggest meme, AI trend, sports moment…"></textarea><button onclick="scan()">✦ Analyze trends</button></section>
 <div class="sectionTitle"><b>Trend signals</b><small>Demo until live source is connected</small></div>
 ${trends.slice(0,5).map((t,i)=>`<div class="trend"><div class="rank">${i+1}</div><div><b>${esc(t.topic)}</b><p>${esc(t.why)}</p></div><strong>${t.score}</strong></div>`).join("")}`);
}
function trendsPage(){
 shell(`<div class="pageTitle"><b>Trend Scanner</b><span>Research shortlist</span></div>
 ${trends.map(t=>`<article class="trendCard"><div class="trendHead"><div><b>${esc(t.topic)}</b><small>${t.momentum} momentum · score ${t.score}</small></div><span>↗</span></div><p>${esc(t.why)}</p><div class="ideas">${t.ideas.map(x=>`<button class="idea" onclick='choose(${JSON.stringify(t)},${JSON.stringify(x)})'><b>${esc(x[0])}</b><em>$${esc(x[1])}</em><small>${esc(x[2])}</small></button>`).join("")}</div></article>`).join("")}`);
}
function choose(t,x){chosen=t;sessionStorage.setItem("coinName",x[0]);sessionStorage.setItem("coinSymbol",x[1]);sessionStorage.setItem("coinDesc",x[2]);create()}
function create(){
 shell(`<div class="pageTitle"><b>Create coin</b><span>Review before signing</span></div>
 ${chosen?`<div class="signal">🔥 Based on <b>${esc(chosen.topic)}</b>. Score ${chosen.score}/100.</div>`:""}
 <section class="panel">
 <label>COIN NAME</label><input id="name" value="${esc(sessionStorage.getItem("coinName")||"")}">
 <label>TICKER</label><input id="symbol" value="${esc(sessionStorage.getItem("coinSymbol")||"")}">
 <label>DESCRIPTION</label><textarea id="desc">${esc(sessionStorage.getItem("coinDesc")||"")}</textarea>
 <label>METADATA JSON URL</label><input id="uri" placeholder="https://your-public-metadata.json">
 <label>INITIAL BUY — SOL</label><input id="buy" type="number" min="0" step=".001" value="0">
 <button class="ghost" onclick="connectWallet()">${wallet?`✓ ${wallet.slice(0,6)}…${wallet.slice(-4)}`:"Connect Solana wallet"}</button>
 <button onclick="launch()">Prepare Pump.fun launch</button>
 </section>
 <p class="fine">This browser version never asks for your seed phrase or private key. The actual Pump.fun transaction must be created by a secure backend and signed by your wallet.</p>`);
}
function coins(){
 shell(`<section class="panel success"><h2>Your launches</h2><p class="fine">No launches recorded in this browser yet.</p><p class="fine">This static iPhone version is the UI/research layer. Connect it to the secure backend before sending a real transaction.</p></section>`)
}
async function scan(){
 const q=document.getElementById("idea").value.trim();
 if(!q){toast("Enter an idea or topic first.");return}
 toast("Demo scan complete. Live X requires the secure backend/API key.");
 trends=[{topic:q+" — emerging angle",score:91,momentum:"Query-driven",why:"This is a concept generated from your query. It is not live X evidence.",ideas:[[q.slice(0,24),"TREND","AI-generated concept from your idea."],[""+q.slice(0,17)+" Coin","COIN","Simple community-token concept."]]},...fallback];
 show("trends")
}
async function connectWallet(){
 if(!window.solana){toast("No compatible Solana wallet detected. Open the deployed site in a wallet browser or use a wallet that injects window.solana.");return}
 try{const r=await window.solana.connect();wallet=r.publicKey.toBase58();toast("Wallet connected.");create()}catch(e){toast(e.message||"Wallet connection cancelled.")}
}
function launch(){
 toast("Ready for backend connection. I separated the iPhone UI from the secure Pump.fun transaction service so your API keys stay off the phone.")
}
function toast(x){let e=document.createElement("div");e.className="toast";e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),4200)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
show("home");
</script>
</body>
</html>
